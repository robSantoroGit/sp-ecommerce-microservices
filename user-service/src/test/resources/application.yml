spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=LEGACY;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: none  # 👈 DISABILITA auto-generation
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  
  sql:
    init:
      mode: always  # 👈 Usa script SQL manuale

logging:
  level:
    org.hibernate.SQL: DEBUG