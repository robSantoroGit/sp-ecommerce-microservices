apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: default
data:
  # Spring
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_APPLICATION_NAME: "order-service"
  
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-order:5432/order_db"
  SPRING_DATASOURCE_USERNAME: "ecommerce"
  
  # Hikari Connection Pool
  HIKARI_MAX_POOL_SIZE: "10"
  HIKARI_MIN_IDLE: "5"
  HIKARI_CONNECTION_TIMEOUT: "30000"
  HIKARI_IDLE_TIMEOUT: "600000"
  HIKARI_MAX_LIFETIME: "1800000"
  
  # JPA
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  
  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC_ORDER_CREATED: "order.created"
  KAFKA_TOPIC_ORDER_STATUS_CHANGED: "order.status.changed"
  KAFKA_TOPIC_ORDER_CANCELLED: "order.cancelled"
  
  # Server
  SERVER_PORT: "8083"
  
  # External Services
  USER_SERVICE_URL: "http://user-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  
  # Actuator
  MANAGEMENT_ENDPOINTS_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_METRICS_PROMETHEUS_ENABLED: "true"
  
  # Swagger/OpenAPI
  SPRINGDOC_API_DOCS_PATH: "/api-docs"
  SPRINGDOC_SWAGGER_UI_PATH: "/swagger-ui.html"
  SPRINGDOC_TAGS_SORTER: "alpha"
  SPRINGDOC_OPERATIONS_SORTER: "method"
  SPRINGDOC_SHOW_ACTUATOR: "false"
  
  # Logging
  LOG_LEVEL_APP: "DEBUG"
  LOG_LEVEL_SPRING: "INFO"
  LOG_LEVEL_SQL: "DEBUG"
  LOG_LEVEL_SQL_BINDER: "TRACE"
  
  # HTTP Client
  HTTP_CLIENT_CONNECT_TIMEOUT: "2s"
  HTTP_CLIENT_READ_TIMEOUT: "5s"
  
  # Circuit Breaker
  CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: "10"
  CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: "50"
  CIRCUIT_BREAKER_WAIT_DURATION: "10000"
  CIRCUIT_BREAKER_HALF_OPEN_CALLS: "3"
  CIRCUIT_BREAKER_AUTO_TRANSITION: "true"
  
  # Retry
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_WAIT_DURATION: "1000"
  
  # Timeout
  TIMEOUT_DURATION: "10s"