apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
  kafka:
    # Kafka version (4.0.0 è la minima supportata da Strimzi latest)
    version: 4.0.0
    
    # Single broker (development)
    replicas: 1
    
    # Listeners (PLAINTEXT come Docker Compose)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
  kafka:
    # Kafka version (4.0.0 è la minima supportata da Strimzi latest)
    version: 4.0.0
    
    # Listeners (PLAINTEXT come Docker Compose)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    
    # Configuration (equivalente a Docker Compose env vars)
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 3
      auto.create.topics.enable: true
      log.retention.hours: 168  # 7 days
  
  # Entity Operator (gestisce topic e user automaticamente)
  entityOperator:
    topicOperator: {}
    userOperator: {}
    # Configuration (equivalente a Docker Compose env vars)
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 3
      auto.create.topics.enable: true
      log.retention.hours: 168  # 7 days
    
    # Persistent storage (equivalente a kafka-data volume)
    storage:
      type: persistent-claim
      size: 1Gi
      class: standard
    
    # Resources (opzionale, per development)
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
  
  # Entity Operator (gestisce topic e user automaticamente)
  entityOperator:
    topicOperator: {}
    userOperator: {}