# Kubernetes-specific configuration for API Gateway
# Activated with SPRING_PROFILES_ACTIVE=kubernetes
# All environment-specific values come from ConfigMap/Secret

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      
  cloud:
    gateway:
      redis-rate-limiter:
        enabled: true

      server:
        webflux:
          routes:
            # Auth Routes (PUBBLICHE)
            - id: auth-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/user-service

            # User Service Routes
            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/user-service

            # Product Service Routes
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**, /api/categories/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: productService
                    fallbackUri: forward:/fallback/product-service
            
            # Order Service Routes (commented out until Kafka is ready)
            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: orderService
                    fallbackUri: forward:/fallback/order-service
        
        # Global CORS configuration
        globalcors:
          corsConfigurations:
            '[/**]':
              allowedOrigins: ${CORS_ALLOWED_ORIGINS:*}
              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
              allowedHeaders: "*"
              allowCredentials: false

# Actuator
# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,gateway,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: ${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}	

# Logging
logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    com.ecommerce.apigateway: ${LOG_LEVEL_APP:DEBUG}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimumNumberOfCalls: 5
    instances:
      userService:
        baseConfig: default
      productService:
        baseConfig: default
      orderService:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      userService:
        baseConfig: default
      productService:
        baseConfig: default
      orderService:
        baseConfig: default
  
  timeout:
    configs:
      default:
        timeoutDuration: 10s
    instances:
      userService:
        baseConfig: default
      productService:
        baseConfig: default
      orderService:
        baseConfig: default