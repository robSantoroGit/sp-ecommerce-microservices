name: CD Pipeline - Deploy to AWS 

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 196390795673.dkr.ecr.eu-south-1.amazonaws.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      order: ${{ steps.filter.outputs.order }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'user-service/**'
            product:
              - 'product-service/**'
            order:
              - 'order-service/**'
            gateway:
              - 'api-gateway/**'

  deploy-user-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build JAR
        run: |
          cd user-service
          mvn clean package -DskipTests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd user-service
          docker build -t $ECR_REGISTRY/ecommerce/user-service:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/ecommerce/user-service:$IMAGE_TAG $ECR_REGISTRY/ecommerce/user-service:latest
          docker push $ECR_REGISTRY/ecommerce/user-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ecommerce/user-service:latest
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update Kubernetes deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/user-service \
            user-service=$ECR_REGISTRY/ecommerce/user-service:$IMAGE_TAG \
            --record
          
          kubectl rollout status deployment/user-service --timeout=5m
      
      - name: Verify deployment
        run: |
          kubectl get pods -l app=user-service
          kubectl logs -l app=user-service --tail=50

  deploy-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build JAR
        run: |
          cd api-gateway
          mvn clean package -DskipTests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push image to ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd api-gateway
          docker build -t $ECR_REGISTRY/ecommerce/api-gateway:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/ecommerce/api-gateway:$IMAGE_TAG $ECR_REGISTRY/ecommerce/api-gateway:latest
          docker push $ECR_REGISTRY/ecommerce/api-gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/ecommerce/api-gateway:latest
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Update Kubernetes deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/api-gateway \
            api-gateway=$ECR_REGISTRY/ecommerce/api-gateway:$IMAGE_TAG \
            --record
          
          kubectl rollout status deployment/api-gateway --timeout=5m
      
      - name: Verify deployment
        run: |
          kubectl get pods -l app=api-gateway
          kubectl logs -l app=api-gateway --tail=50

  smoke-tests:
    needs: [deploy-user-service, deploy-api-gateway]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments
        run: sleep 1
      
      - name: Health Check API Gateway
        run: |
          echo "Testing API Gateway..."
          curl -f --retry 3 --retry-delay 10 \
            http://35.152.222.113:30080/actuator/health
          echo "✅ API Gateway healthy!"
      
      - name: Test User Registration (E2E)
        run: |
          echo "Testing user registration endpoint..."
          curl -X POST http://35.152.222.113:30080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-test-user","email":"test@ci.com","password":"Test123!","role":"CUSTOMER"}' \
            || echo "⚠️ Registration test failed (might be expected if user exists)"
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Deployment completed!"
          echo "API Gateway: http://35.152.222.113:30080"
          echo "Health: http://35.152.222.113:30080/actuator/health"
          echo "=========================================="