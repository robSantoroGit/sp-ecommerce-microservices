name: CI Pipeline (No Docker Upload)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # Detect which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      order: ${{ steps.filter.outputs.order }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user:
              - 'user-service/**'
            product:
              - 'product-service/**'
            order:
              - 'order-service/**'
            gateway:
              - 'api-gateway/**'

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./user-service
      run: mvn test
      
    - name: SonarCloud Scan
      working-directory: ./user-service
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=robsantorogit_user-service \
          -Dsonar.organization=robsantorogit \
          -Dsonar.host.url=https://sonarcloud.io  
      
    - name: Build JAR
      working-directory: ./user-service
      run: mvn package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: user-service-coverage
        path: user-service/target/site/jacoco/
        retention-days: 7
  
  test-product-service:
    name: Test Product Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.product == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./product-service
      run: mvn test
    
    - name: SonarCloud Scan
      working-directory: ./product-service
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=robsantorogit_product-service \
          -Dsonar.organization=robsantorogit \
          -Dsonar.host.url=https://sonarcloud.io   
      
    - name: Build JAR
      working-directory: ./product-service
      run: mvn package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: product-service-coverage
        path: product-service/target/site/jacoco/
        retention-days: 7

  test-order-service:
    name: Test Order Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.order == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./order-service
      run: mvn test
    
    - name: SonarCloud Scan
      working-directory: ./order-service
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=robsantorogit_order-service \
          -Dsonar.organization=robsantorogit \
          -Dsonar.host.url=https://sonarcloud.io     
      
    - name: Build JAR
      working-directory: ./order-service
      run: mvn package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: order-service-coverage
        path: order-service/target/site/jacoco/
        retention-days: 7

  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./api-gateway
      run: mvn test
      
    - name: Build JAR
      working-directory: ./api-gateway
      run: mvn package -DskipTests
    
  # Build Docker images - only for changed services
  build-docker-user-service:
    name: Build User Service Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-user-service]
    if: |
      github.event_name == 'push' && 
      needs.detect-changes.outputs.user == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build User Service Image
      working-directory: ./user-service
      run: |
        mvn package -DskipTests
        docker build -t user-service:${{ github.sha }} .
        docker tag user-service:${{ github.sha }} user-service:latest
        echo "✅ User Service image built successfully"

  build-docker-product-service:
    name: Build Product Service Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-product-service]
    if: |
      github.event_name == 'push' && 
      needs.detect-changes.outputs.product == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Product Service Image
      working-directory: ./product-service
      run: |
        mvn package -DskipTests
        docker build -t product-service:${{ github.sha }} .
        docker tag product-service:${{ github.sha }} product-service:latest
        echo "✅ Product Service image built successfully"

  build-docker-order-service:
    name: Build Order Service Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-order-service]
    if: |
      github.event_name == 'push' && 
      needs.detect-changes.outputs.order == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Order Service Image
      working-directory: ./order-service
      run: |
        mvn package -DskipTests
        docker build -t order-service:${{ github.sha }} .
        docker tag order-service:${{ github.sha }} order-service:latest
        echo "✅ Order Service image built successfully"

  build-docker-api-gateway:
    name: Build API Gateway Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-api-gateway]
    if: |
      github.event_name == 'push' && 
      needs.detect-changes.outputs.gateway == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API Gateway Image
      working-directory: ./api-gateway
      run: |
        mvn package -DskipTests
        docker build -t api-gateway:${{ github.sha }} .
        docker tag api-gateway:${{ github.sha }} api-gateway:latest
        echo "✅ API Gateway image built successfully"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test-user-service, test-product-service, test-order-service, test-api-gateway]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Services Tested:" >> $GITHUB_STEP_SUMMARY
        echo "- User Service: ${{ needs.detect-changes.outputs.user == 'true' && '✅ Tested + SonarCloud' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Product Service: ${{ needs.detect-changes.outputs.product == 'true' && '✅ Tested + SonarCloud' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Order Service: ${{ needs.detect-changes.outputs.order == 'true' && '✅ Tested + SonarCloud' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- API Gateway: ${{ needs.detect-changes.outputs.gateway == 'true' && '✅ Tested + SonarCloud' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 View SonarCloud: https://sonarcloud.io/organizations/robsantorogit/projects" >> $GITHUB_STEP_SUMMARY