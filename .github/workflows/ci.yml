name: CI Pipeline (No Docker Upload)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./user-service
      run: mvn test
      
    - name: Build JAR
      working-directory: ./user-service
      run: mvn package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: user-service-coverage
        path: user-service/target/site/jacoco/
        retention-days: 7
  build-docker-images:
    name: Build Docker Images (Validation Only)
    runs-on: ubuntu-latest
    needs: [test-user-service]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build User Service Image
      working-directory: ./user-service
      run: |
        mvn package -DskipTests
        docker build -t user-service:${{ github.sha }} .
        docker tag user-service:${{ github.sha }} user-service:latest
        echo "✅ User Service image built successfully"