name: CI Pipeline (No Docker Upload)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./user-service
      run: ./mvnw test
      
    - name: Build JAR
      working-directory: ./user-service
      run: ./mvnw package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: user-service-coverage
        path: user-service/target/site/jacoco/
        retention-days: 7  