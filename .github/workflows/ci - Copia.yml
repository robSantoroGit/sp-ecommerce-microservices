name: CI Pipeline (No Docker Upload)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./user-service
      run: ./mvnw test
      
    - name: Build JAR
      working-directory: ./user-service
      run: ./mvnw package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: user-service-coverage
        path: user-service/target/site/jacoco/
        retention-days: 7

  test-product-service:
    name: Test Product Service
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./product-service
      run: ./mvnw test
      
    - name: Build JAR
      working-directory: ./product-service
      run: ./mvnw package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: product-service-coverage
        path: product-service/target/site/jacoco/
        retention-days: 7

  test-order-service:
    name: Test Order Service
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./order-service
      run: ./mvnw test
      
    - name: Build JAR
      working-directory: ./order-service
      run: ./mvnw package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: order-service-coverage
        path: order-service/target/site/jacoco/
        retention-days: 7

  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run tests
      working-directory: ./api-gateway
      run: ./mvnw test
      
    - name: Build JAR
      working-directory: ./api-gateway
      run: ./mvnw package -DskipTests
      
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-gateway-coverage
        path: api-gateway/target/site/jacoco/
        retention-days: 7

  build-docker-images:
    name: Build Docker Images (Validation Only)
    runs-on: ubuntu-latest
    needs: [test-user-service, test-product-service, test-order-service, test-api-gateway]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build User Service Image
      working-directory: ./user-service
      run: |
        ./mvnw package -DskipTests
        docker build -t user-service:${{ github.sha }} .
        docker tag user-service:${{ github.sha }} user-service:latest
        echo "✅ User Service image built successfully"
    
    - name: Build Product Service Image
      working-directory: ./product-service
      run: |
        ./mvnw package -DskipTests
        docker build -t product-service:${{ github.sha }} .
        docker tag product-service:${{ github.sha }} product-service:latest
        echo "✅ Product Service image built successfully"
    
    - name: Build Order Service Image
      working-directory: ./order-service
      run: |
        ./mvnw package -DskipTests
        docker build -t order-service:${{ github.sha }} .
        docker tag order-service:${{ github.sha }} order-service:latest
        echo "✅ Order Service image built successfully"
    
    - name: Build API Gateway Image
      working-directory: ./api-gateway
      run: |
        ./mvnw package -DskipTests
        docker build -t api-gateway:${{ github.sha }} .
        docker tag api-gateway:${{ github.sha }} api-gateway:latest
        echo "✅ API Gateway image built successfully"
    
    - name: Verify images
      run: |
        echo "## Docker Images Built" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        docker images | grep -E "(user-service|product-service|order-service|api-gateway)" >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ℹ️ Images built for validation only (not uploaded to save storage)" >> $GITHUB_STEP_SUMMARY

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-user-service, test-product-service, test-order-service, test-api-gateway, build-docker-images]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Docker images built and validated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 Coverage reports available in Artifacts" >> $GITHUB_STEP_SUMMARY